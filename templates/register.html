<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل وحجز طالب جديد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; padding: 20px; }</style>
</head>
<body>

<div class="container bg-white p-4 rounded shadow" style="max-width: 700px;">
    <h3 class="text-center text-primary mb-4">تسجيل طالب جديد وحجز موعد</h3>

    {{ if .error }} <div class="alert alert-danger">{{ .error }}</div> {{ end }}

    <form action="/register-and-book" method="POST" enctype="multipart/form-data">
        
        <h5 class="border-bottom pb-2 mb-3">1. البيانات الشخصية</h5>
        <div class="row mb-3">
            <div class="col"><input type="text" name="first_name" class="form-control" placeholder="الاسم الأول" required></div>
            <div class="col"><input type="text" name="last_name" class="form-control" placeholder="اسم العائلة" required></div>
        </div>
        <div class="mb-3"><input type="text" name="phone" class="form-control" placeholder="رقم الواتساب" required></div>
        <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="البريد الإلكتروني" required></div>

        <h5 class="border-bottom pb-2 mb-3 mt-4">2. تفاصيل الحجز (تحديد مستوى)</h5>
        <div class="alert alert-info py-2">سعر حصة تحديد المستوى: <strong>50 جنيه</strong></div>
        
        <input type="hidden" name="booking_type" value="assessment">
        <input type="hidden" name="amount" value="50">

        <div class="mb-3">
            <label class="form-label">اختر الموعد المناسب:</label>
            <select name="slot_id" class="form-select" required>
                <option value="" disabled selected>-- المواعيد المتاحة --</option>
                {{ range .slots }}
                    <option value="{{ .ID }}">{{ .Day }} - {{ .Time }}</option>
                {{ end }}
            </select>
        </div>

        <h5 class="border-bottom pb-2 mb-3 mt-4">3. تأكيد الدفع</h5>
        <div class="mb-3">
            <label class="form-label">صورة إيصال التحويل</label>
            <input type="file" name="receipt" class="form-control" required accept="image/*">
        </div>

        <button type="submit" class="btn btn-success w-100 btn-lg">تسجيل وحجز فوري</button>
        <div class="text-center mt-3">
            <a href="/login">هل أنت طالب مسجل بالفعل؟ اضغط هنا للتجديد</a>
        </div>
    </form>
</div>

</body>
</html>
