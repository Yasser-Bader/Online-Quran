<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>تجديد الاشتراك</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow" style="width: 400px;">
        <h4 class="text-center mb-4 text-primary">تسجيل دخول (مشترك حالي)</h4>
        
        {{ if .error }}
            <div class="alert alert-danger text-center" role="alert">
                {{ .error }}
            </div>
        {{ end }}

        <form action="/login-check" method="POST">
            <div class="mb-3">
                <label class="form-label">أدخل رقم الواتساب المسجل:</label>
                <input type="text" name="phone" class="form-control" placeholder="010xxxxxxx" required>
            </div>
            <button class="btn btn-primary w-100">دخول لصفحة الحجز</button>
        </form>
        
        <div class="text-center mt-3">
            <hr>
            <p class="mb-2">ليس لديك حساب؟</p>
            <a href="/" class="btn btn-outline-success w-100">تسجيل طالب جديد</a>
        </div>
    </div>
</body>
</html>
