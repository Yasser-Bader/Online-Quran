<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - آفاق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0E2A47; --gold: #C5A059; }
        body { background-color: #f4f6f9; font-family: 'Cairo', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            width: 100%; max-width: 400px; background: white; padding: 40px;
            border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary);
        }
        .btn-primary {
            background-color: var(--primary); border: none; font-weight: bold; padding: 12px;
        }
        .btn-primary:hover { background-color: #0a1f35; }
        .btn-outline-gold {
            color: var(--primary); border-color: var(--gold);
        }
        .btn-outline-gold:hover {
            background-color: var(--gold); color: white;
        }
        .form-control { border-radius: 10px; padding: 12px; }
        .form-control:focus { border-color: var(--gold); box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="images/logo1.png" width="80" alt="Logo">
            <h4 class="mt-3 fw-bold" style="color: var(--primary);">تسجيل الدخول</h4>
            <p class="text-muted small">للطلاب المشتركين حالياً</p>
        </div>

        {{ if .error }}
            <div class="alert alert-danger text-center shadow-sm">{{ .error }}</div>
        {{ end }}

        {{ if .warning }}
            <div class="alert alert-warning text-center shadow-sm">
                <strong>⏳ طلبك قيد المراجعة</strong><br>
                <small>{{ .warning }}</small>
            </div>
        {{ end }}

        <form action="/login-check" method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold text-muted">رقم الواتساب المسجل</label>
                <input type="text" name="phone" class="form-control" placeholder="010xxxxxxx" required>
            </div>
            <button class="btn btn-primary w-100 mb-3 shadow-sm">دخول لصفحة الحجز</button>
        </form>
        
        <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-2 text-muted">ليس لديك حساب؟</p>
            <a href="/register" class="btn btn-outline-gold w-100">تسجيل طالب جديد</a>
        </div>
    </div>

</body>
</html>
